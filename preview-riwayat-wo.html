<body>
<header class="top">PLN WORKSPACE &middot; IWOMS</header>
<main class="history-page">
  <div class="history-header"><p class="muted">Preview Detail WO</p><h1>Riwayat WO</h1><p class="muted">WO-DEMO-048 &middot; Pemeliharaan Insulator Penegang Fasa R</p></div>
  <section class="box" aria-label="Riwayat dan pilihan skenario">
    <div class="history-filters">
      <label>Skenario
        <select id="scenario">
          <option value="normal">Jalur normal &mdash; WO Completed</option>
          <option value="active">Sedang berjalan &mdash; menunggu penilaian survei</option>
          <option value="proposal">Usulan dikembalikan dan diajukan ulang</option>
          <option value="survey-repeat">Survei diulang lalu dinyatakan layak</option>
          <option value="stop">Survei tidak layak &mdash; WO dihentikan</option>
          <option value="revision">JSA dikembalikan dan disetujui setelah revisi</option>
          <option value="height">Izin ketinggian dibuka dan ditutup</option>
          <option value="delegation">Delegasi pengawasan</option>
          <option value="height-delegation">Izin ketinggian dan delegasi pengawasan</option>
          <option value="hold">On Hold lalu diaktifkan kembali</option>
          <option value="cancel-rejected">Usulan pembatalan ditolak</option>
          <option value="cancel">On Hold lalu WO dibatalkan</option>
          <option value="swa">SWA lalu pekerjaan dilanjutkan</option>
          <option value="normalization">Penormalan diulang</option>
          <option value="file">Berkas penutupan belum lengkap</option>
        </select>
      </label>
      <label id="cause-label" hidden>Penyebab On Hold<select id="cause"></select></label>
    </div>
    <nav class="tabs" aria-label="Bagian detail WO">
      <button type="button" data-panel="documents" aria-pressed="false" aria-controls="documents">Dokumen <span id="document-count" class="badge"></span></button>
      <button type="button" data-panel="history" aria-pressed="true" aria-controls="history">Riwayat</button>
    </nav>
    <div id="documents" hidden>
      <p id="document-error" role="status" class="muted"></p>
      <div id="document-list"></div>
      <div class="actions" aria-label="Mode dokumen" style="align-items:center;margin:10px 0">
        <label for="document-mode">Mode dokumen</label>
        <select id="document-mode" style="width:auto">
          <option value="filled">Terisi data WO</option>
          <option value="blank">Blangko kosong</option>
        </select>
        <span class="muted">Mode ini berlaku untuk pratinjau dan unduhan.</span>
      </div>
      <section id="document-viewer" class="document-viewer" aria-label="Pratinjau dokumen" hidden>
        <nav id="document-titles" class="actions" aria-label="Pilih dokumen"></nav>
        <div class="viewer-controls">
          <button id="document-prev" class="button" type="button" aria-label="Dokumen sebelumnya">&lt;</button>
          <span id="document-position"></span>
          <button id="document-next" class="button" type="button" aria-label="Dokumen berikutnya">&gt;</button>
        </div>
        <h3 id="document-title" tabindex="-1"></h3>
        <p id="document-note" class="muted" role="status"></p>
        <button id="download-preview" type="button" class="button" disabled>Unduh PDF</button>
        <iframe id="document-pdf" title="Template dokumen" hidden></iframe>
      </section>
    </div>
    <div id="history">
    <p id="result" class="muted" aria-live="polite"></p>
    <div id="groups" class="group-list"></div>
    </div>
  </section>
  <p style="margin-top:14px"><a class="button" href="preview-detail-wo.html">Kembali ke preview Detail WO</a></p>
</main>

<script>
const actors={

  M:['Arif Demo','Manajer Area / Kepala Operasi'], P:['Rian Demo','Preparator PDKB'],
  K:['Maya Demo','P2K3/K3L'], B:['Wahyu Demo','Bagian Terkait'], K3:['Ayu Demo','Pengawas K3 PDKB'],
  R:['Sugeng Demo','Kepala Regu PDKB'], L:['Agus Demo','Pelaksana PDKB'],
  PA:['Nisa Demo','Piket Area'], APD:['Fajar Demo','Piket APD'], GI:['Putri Demo','Petugas GI'],
};
const catalog=[
 ['Pengajuan & Persetujuan WO',[
  'WO diajukan|TL','Usulan disetujui Asman|A','Usulan disetujui Supervisor|S','Usulan disahkan|M','Prioritas dan rencana kerja ditetapkan|S']],
 ['Survei & Rencana Pelaksanaan',[
  'Hasil survei lokasi dicatat|P','Analisis awal JSA dan IBPPR disusun|P','Pekerjaan dinyatakan layak|S','Jadwal, personel, dan metode kerja ditetapkan|P']],
 ['Dokumen, Kewenangan & Serah Terima',[
  'JSA diajukan|P','JSA diperiksa dan diteruskan|K','JSA disetujui|A',
  'IBPPR diajukan|P','IBPPR diperiksa dan diteruskan|K','IBPPR disetujui|A',

 ['Kesiapan Lapangan & SOK Awal',[

  'Hasil pemeriksaan kesehatan, APD, dan safety briefing dicatat|K3','Rencana mulai dikoordinasikan|R',
  'Pemberlakuan SOK diminta|R','Permintaan diteruskan ke APD|PA','Permintaan dikoordinasikan ke GI|APD',
  'Hasil pengaturan SOK dicatat|GI','Hasil diteruskan ke Area|APD','Hasil disampaikan ke Kepala Regu|PA',
  'SOK dinyatakan terkonfirmasi|R','Kondisi awal dinyatakan memenuhi|R']],
 ['Pelaksanaan & Pengawasan',[
  'Putaran pelaksanaan dimulai|R','Laksanakan pekerjaan sesuai SP2B/SOP|L|Tugas paralel','Koordinasikan pengawasan pekerjaan|R|Tugas paralel',
  'Awasi K3 selama pekerjaan|K3|Tugas paralel','Tidak ada kondisi tidak aman|K3','Pekerjaan fisik dinyatakan selesai|R','Selesai fisik dilaporkan|L']],
 ['Penormalan & Selesai Operasional',[
  'Penormalan diminta|R','Permintaan diteruskan ke APD|PA','Permintaan diteruskan ke GI|APD',
  'Hasil penormalan dicatat|GI','Hasil dikonfirmasi ke Area|APD','Hasil dikonfirmasi ke Kepala Regu|PA',
  'Penormalan dinyatakan terkonfirmasi|R','Pekerjaan dinyatakan selesai operasional|R']],
 ['Laporan & Penutupan Administrasi',[
  'Laporan hasil diserahkan|R','Pemberitahuan penyelesaian diajukan|P','Pemberitahuan diperiksa dan ditandatangani|S',
  'Pemberitahuan ditandatangani sebagai Pengawas Pekerjaan|R','Pemberitahuan ditandatangani|K3',
  'Pemberitahuan disampaikan ke Kepala Operasi|P','Pemberitahuan diterima|M','Laporan kinerja harian diinput|P',
  'Berkas pekerjaan dikumpulkan|P','Dokumen dan tanda tangan dinyatakan lengkap|P','Paket dokumen diarsipkan|P','Administrasi ditutup|P']],
];
const holds=[
 ['JSA',2,2,'P','Ajukan JSA untuk diperiksa'],
 ['IBPPR',2,5,'P','Ajukan IBPPR untuk diperiksa'],
 ['Izin ketinggian',2,6,'P','Siapkan ulang izin'],
 ['Surat Kewenangan',2,6,'P','Verifikasi kewenangan'],
 ['SP2B',2,9,'P','Susun dan ajukan kembali SP2B'],
 ['SP3B',2,12,'P','Susun dan ajukan kembali SP3B'],
 ['Checklist',2,15,'P','Isi dan periksa kembali checklist'],
 ['Alat atau material lapangan',3,2,'P','Perintahkan cek ulang peralatan'],
 ['Konfirmasi SOK awal',3,11,'R','Minta pemberlakuan SOK kembali'],
 ['Kondisi awal',3,12,'R','Periksa cuaca, kondisi aman, dan SOK'],
 ['Penerima delegasi',3,13,'P','Verifikasi kompetensi calon'],
 ['Bahaya saat pelaksanaan',4,4,'R','Periksa cuaca, kondisi aman, dan SOK'],
];
const documentCatalog=[
  {name:'Form Survei', event:/^Hasil survei (lokasi|ulang) dicatat/},
  {name:'JSA', event:/^JSA diajukan/},
  {name:'IBPPR', event:/^IBPPR diajukan/},
  {name:'Izin Kerja Ketinggian', event:/^Izin ketinggian diperlukan dan diajukan/, completion:/^Penutupan izin dicatat/, condition:'Jika pekerjaan memerlukan izin ketinggian'},
  {name:'Surat Kewenangan personel', event:/^Surat Kewenangan (dan kompetensi|dikumpulkan)/},
  {name:'SP2B', event:/^SP2B diajukan/},
  {name:'SP3B', event:/^SP3B diajukan/},
  {name:'Checklist peralatan dan material', event:/^Checklist peralatan dan material diajukan/},
  {name:'Berita Acara Delegasi', event:/^BA delegasi disiapkan/, condition:'Jika pengawasan didelegasikan'},
  {name:'Laporan Hasil Pekerjaan', event:/^Laporan hasil diserahkan/},

  {name:'Laporan Kinerja Harian', event:/^Laporan kinerja harian diinput/},
];
const scenario=document.querySelector('#scenario');
const cause=document.querySelector('#cause');
const labels=document.querySelector('#cause-label');
holds.forEach(([name],index)=>cause.add(new Option('H'+String(index+1).padStart(2,'0')+' - '+name,index)));
function build(key){
  const entries=catalog.map(([,list])=>[...list]);
  let terminal=-1;
  let focus=0;
  if(key==='active'||key==='stop'){
    focus=1;
    entries[1].splice(2);
    entries.fill(null,2);
    if(key==='stop'){
      entries[1].push('WO dihentikan karena hasil survei tidak layak|S','Pengusul diberi tahu|S');
      terminal=1;
    }
  }
  if(key==='proposal') {
    focus=0;
    entries[0].splice(1,0,'Usulan dikembalikan|A|Lokasi aset perlu diperjelas.','Penolakan diteruskan ke TL pengusul asal|A','Usulan direvisi dan diajukan ulang|TL|Versi 2');
  }
  if(key==='survey-repeat'){
    focus=1;
    entries[1].splice(2,0,'Survei ulang diminta|S','Hasil survei ulang dicatat|P','Analisis awal JSA dan IBPPR diperbarui|P');
  }
  if(key==='revision'){
    focus=2;
    entries[2].splice(2,0,'JSA dikembalikan|A|Versi 1 dikembalikan untuk dilengkapi.','JSA diperbaiki|P','JSA diajukan kembali|P|Versi 2','JSA diperiksa ulang dan diteruskan|K|Versi 2');
  }
  if(['height','height-delegation'].includes(key)){
    focus=2;
    entries[2].splice(6,0,'Izin ketinggian diperlukan dan diajukan|P','Izin diperiksa Pengawas K3|K3','Izin ditandatangani Asman|A','Izin ditandatangani P2K3/K3L|K','Izin ditandatangani Bagian Terkait|B','Izin lengkap dicatat|P');
    entries[6].unshift('Penutupan izin disiapkan|P','Penutupan izin ditandatangani Pengawas K3|K3','Penutupan izin ditandatangani Asman|A','Penutupan izin ditandatangani P2K3/K3L|K','Penutupan izin ditandatangani Bagian Terkait|B','Penutupan izin dicatat|P');
  }
  if(['delegation','height-delegation'].includes(key)){
    focus=3;
    entries[3].push('Delegasi pengawasan diperlukan|R','Kompetensi calon diverifikasi|S','BA delegasi disiapkan dan ditandatangani|R','BA delegasi diterima dan ditandatangani|L','BA ditandatangani sebagai pihak mengetahui|S','BA delegasi diarsipkan|P');
  }
  if(['hold','cancel','cancel-rejected'].includes(key)){
    const [label,group,offset,owner,resume]=holds[Number(cause.value)];
    const id='H'+String(Number(cause.value)+1).padStart(2,'0');
    focus=group;
    const notes=['WO ditahan|S|'+id+' - '+label,'Pemenuhan kendala dikoordinasikan|'+owner];
    if(key==='hold')notes.push('Kendala teratasi|S','WO diaktifkan kembali|S|Tugas berikutnya: '+resume);
    else notes.push('Kendala tidak dapat diselesaikan|S','Pembatalan WO diusulkan|S');
    if(key==='cancel'){
      notes.push('Pembatalan disetujui|M','WO dibatalkan|M');
      terminal=group;
    }
    if(key==='cancel-rejected')notes.push('Pembatalan ditolak|M','Pemenuhan kendala dilanjutkan|'+owner);
    const beforeHold = {
      1:['JSA dikembalikan untuk perbaikan|A','JSA belum dapat diperbaiki|P'],
      2:['IBPPR dikembalikan untuk perbaikan|A','IBPPR belum dapat diperbaiki|P'],
      3:['Izin ketinggian diperlukan dan diajukan|P','Izin dikembalikan|K3','Izin belum dapat diperbaiki|P'],
      4:['Surat Kewenangan dikumpulkan|P','Masa berlaku atau kompetensi belum memenuhi|P'],
      5:['SP2B dikembalikan|S','SP2B belum dapat diperbaiki|P'],
      6:['SP3B dikembalikan|S','SP3B belum dapat diperbaiki|P'],
      7:['Checklist dikembalikan|S','Checklist belum dapat diperbaiki|P'],
      8:['Alat atau material belum siap|L'],
      9:['SOK belum terkonfirmasi dan koordinasi tidak dapat diulang|R'],
      10:['Kondisi awal tidak aman|R','Rencana mulai dihentikan dan risiko dievaluasi|R','Risiko dan keselamatan diperiksa ulang|K3'],
      11:['Delegasi pengawasan diperlukan|R','Kompetensi calon diverifikasi|S','Calon kompeten belum tersedia|S'],
      12:['Kondisi tidak aman teridentifikasi|K3','Pekerjaan dihentikan sementara|R','Aktivitas dihentikan dan lokasi diamankan|L','Bahaya dievaluasi|K3','Syarat aman belum terpenuhi|R'],
    };
    entries[group].splice(offset,Infinity,...beforeHold[Number(cause.value)+1],...notes);
    entries.fill(null,group+1);
  }
  if(key==='swa'){
    focus=4;
    entries[4].splice(4,0,'Kondisi tidak aman teridentifikasi|K3','Pekerjaan dihentikan sementara|R','Aktivitas dihentikan dan lokasi diamankan|L','Bahaya dievaluasi|K3','Syarat aman terpenuhi|R','Putaran pelaksanaan dilanjutkan|R',...entries[4].slice(1,4).map(event=>event.replace('Tugas paralel','Tugas paralel, putaran 2')));
  }
  if(key==='normalization'){
    focus=5;
    entries[5].splice(6,0,'Penormalan belum terkonfirmasi|R',...entries[5].slice(0,6).map(value=>value+'|Putaran 2'));
  }
  if(key==='file'){
    focus=6;
    entries[6].splice(-3,0,'Dokumen dan tanda tangan diperiksa|P','Kelengkapan berkas diminta|P','Dokumen yang dilengkapi diverifikasi|P','Dokumen dan tanda tangan diperiksa kembali|P');
  }
  return {entries,terminal,focus};
}
function element(tag,cls,text){
  const node=document.createElement(tag);
  if(cls)node.className=cls;
  if(text)node.textContent=text;
  return node;
}

const documentList=document.querySelector('#document-list');
const viewer=document.querySelector('#document-viewer');
const pdf=document.querySelector('#document-pdf');
const previousDocument=document.querySelector('#document-prev');
const nextDocument=document.querySelector('#document-next');
let availableDocuments=[];
let selectedDocument=-1;
let selectedUrl;
let previewRequest=0;
let documentEvents=[];
const formatter=new Intl.DateTimeFormat('id-ID',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Jakarta'});
const dateFormatter=new Intl.DateTimeFormat('id-ID',{dateStyle:'long',timeZone:'Asia/Jakarta'});
const modeSelector=document.querySelector('#document-mode');
const downloadPreview=document.querySelector('#download-preview');
const note=document.querySelector('#document-note');
const generated=new Map();
function eventDate(index){
  return new Date(Date.UTC(2026,10,20,1,0)+index*3600000);
}
function generateDocument(item){
  const mode=modeSelector.value;
  const key=mode+':'+item.name;
  if(!generated.has(key)){
    generated.set(key,PreviewWoPdf.create(item,mode,PreviewWoPdf.workOrder,documentEvents)
      .catch(error=>{generated.delete(key);throw error;}));
  }
  return generated.get(key);
}
function resetPdf(){
  downloadPreview.disabled=true;
  pdf.hidden=true;
  pdf.removeAttribute('src');
  if(selectedUrl)URL.revokeObjectURL(selectedUrl);
  selectedUrl=null;
}
async function downloadDocument(item,button){
  button.disabled=true;
  try {
    const result=await generateDocument(item);
    const url=URL.createObjectURL(result.blob);
    const link=element('a');
    link.href=url;
    link.download=result.filename;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
  } catch(error){
    document.querySelector('#document-error').textContent=error.message;
  } finally {button.disabled=false;}
}
modeSelector.addEventListener('change',()=>{
  if(selectedDocument>=0)openDocument(selectedDocument);
});
downloadPreview.addEventListener('click',()=>{
  const item=availableDocuments[selectedDocument];
  if(item)downloadDocument(item,downloadPreview);
});

async function openDocument(index){
  const item=availableDocuments[index];
  if(!item)return;
  const request=++previewRequest;
  selectedDocument=index;
  viewer.hidden=false;
  resetPdf();
  document.querySelector('#document-title').textContent=item.name;
  note.textContent='Menyiapkan PDF...';
  document.querySelector('#document-position').textContent=(index+1)+' / '+availableDocuments.length;
  previousDocument.disabled=index===0;
  nextDocument.disabled=index===availableDocuments.length-1;
  document.querySelectorAll('#document-titles button').forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));
  document.querySelectorAll('#document-list [data-document-index]').forEach(button=>{
    const active=Number(button.dataset.documentIndex)===index;
    button.textContent=active?'Tutup pratinjau':'Lihat pratinjau';
    button.setAttribute('aria-expanded',String(active));
  });
  try {
    const result=await generateDocument(item);
    if(request!==previewRequest)return;
    selectedUrl=URL.createObjectURL(result.blob);
    pdf.src=selectedUrl;
    pdf.hidden=false;
    downloadPreview.disabled=false;
    note.textContent=result.isDemoForm?'Formulir demo BPMN. Template sumber belum tersedia.':'Pratinjau berdasarkan formulir sumber.';
  } catch(error){
    if(request===previewRequest)note.textContent=error.message;
  }
}
function closeDocument(){
  selectedDocument=-1;
  previewRequest++;
  viewer.hidden=true;
  resetPdf();
  document.querySelectorAll('#document-list [data-document-index]').forEach(button=>{
    button.textContent='Lihat pratinjau';
    button.setAttribute('aria-expanded','false');
  });
}
function renderDocuments(entries){
  closeDocument();
  const events=entries.flatMap(items=>items||[]);
  generated.clear();
  document.querySelector('#document-error').textContent='';
  documentEvents=events.map((event,index)=>{
    const [name,role]=event.split('|');
    return {name,actor:actors[role][0],date:dateFormatter.format(eventDate(index))};
  });
  availableDocuments=documentCatalog.flatMap(doc=>{
    const versions=events.filter(event=>doc.event.test(event));
    return versions.length?[{...doc,version:versions.length,completion:doc.completion && events.some(event=>doc.completion.test(event))}]:[];
  });
  const visibleDocuments=documentCatalog.filter(doc=>doc.condition || availableDocuments.some(item=>item.name===doc.name));
  document.querySelector('#document-count').textContent=availableDocuments.length;
  documentList.replaceChildren();
  const titles=document.querySelector('#document-titles');
  titles.replaceChildren();
  if(!availableDocuments.length){
    documentList.append(element('p','muted','Belum ada dokumen pada tahap yang ditampilkan.'));
  }
  const header=element('div','doc-head');
  header.append(element('span','','Dokumen'),element('span','','Versi'));
  documentList.append(header);
  visibleDocuments.forEach(entry=>{
    const index=availableDocuments.findIndex(item=>item.name===entry.name);
    const doc=availableDocuments[index];
    const row=element('div','doc');
    const actions=element('div','actions');
    const identity=element('div');
    identity.append(element('strong','',entry.name));
    if(entry.condition){
      const condition=element('div','doc-condition');
      condition.append(element('span','badge','Bersyarat'),element('p','muted',entry.condition));
      identity.append(condition);
    }
    if(!doc){
      row.append(identity,element('span','muted','Belum tersedia'),actions);
      documentList.append(row);
      return;
    }
    const preview=element('button','button','Lihat pratinjau');
    preview.type='button';
    preview.dataset.documentIndex=String(index);
    preview.setAttribute('aria-controls','document-viewer');
    preview.setAttribute('aria-expanded','false');
    preview.addEventListener('click',()=>{
      if(selectedDocument===index)closeDocument();
      else {
        openDocument(index);
        document.querySelector('#document-title').focus();
      }
    });
    actions.append(preview);
    const download=element('button','button','Unduh');
    download.type='button';
    download.setAttribute('aria-label','Unduh '+doc.name+' (PDF)');
    download.addEventListener('click',()=>downloadDocument(doc,download));
    actions.append(download);
    row.append(identity,element('span','','Versi '+doc.version),actions);
    documentList.append(row);
  });
  availableDocuments.forEach((doc,index)=>{
    const title=element('button','button',doc.name);
    title.type='button';
    title.setAttribute('aria-pressed','false');
    title.addEventListener('click',()=>openDocument(index));
    titles.append(title);
  });
}
previousDocument.addEventListener('click',()=>openDocument(selectedDocument-1));
nextDocument.addEventListener('click',()=>openDocument(selectedDocument+1));
document.querySelectorAll('[data-panel]').forEach(tab=>tab.addEventListener('click',()=>{
  document.querySelectorAll('[data-panel]').forEach(button=>{
    const active=button===tab;
    button.setAttribute('aria-pressed',String(active));
    document.getElementById(button.dataset.panel).hidden=!active;
  });
}));

function render(){
  const key=scenario.value;
  labels.hidden=!['hold','cancel','cancel-rejected'].includes(key);
  const {entries,terminal,focus}=build(key);
  renderDocuments(entries);
  const groups=document.querySelector('#groups');
  groups.replaceChildren();
  let eventNumber=0;
  for(const [index,[title]] of catalog.entries()){
    const events=entries[index]||[];
    const groupStatus=terminal===index?'Berakhir':focus===index&&['active','hold','cancel-rejected'].includes(key)?'Sedang berjalan':events.length?'Selesai':terminal<0?'Belum dimulai':'Tidak dijalankan';
    const row=element('details','box');
    row.open=index===focus;
    const heading=element('summary');
    heading.append(element('span','',title),element('span','badge'+(groupStatus==='Selesai'?' ok':''),groupStatus));
    row.append(heading);
    if(!events.length)row.append(element('p','muted','Belum ada kejadian tercatat.'));
    else{
      const list=element('ol','timeline');
      for(const event of events){
        const [name,actor,note]=event.split('|');
        const date=eventDate(eventNumber++);
        const item=element('li');
        const line=element('div','event-line');
        const time=element('time','',formatter.format(date)+' WIB');
        time.dateTime=date.toISOString();
        line.append(element('strong','',name),time);
        item.append(line,element('p','muted',actors[actor].join(String.fromCharCode(32,183,32))));
        if(note)item.append(element('p','event-note',note));
        list.append(item);
      }
      row.append(list);
    }
    groups.append(row);
  }
  document.querySelector('#result').textContent=catalog.length+' kelompok tahap, '+eventNumber+' kejadian pada skenario ini.';
}
scenario.addEventListener('change',render);
cause.addEventListener('change',render);
render();
</script>
